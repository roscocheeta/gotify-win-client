<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Blue App Icon Background Gradient -->
    <linearGradient id="icon-bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1673f4" />
      <stop offset="42%" stop-color="#0f5fda" />
      <stop offset="100%" stop-color="#043aa7" />
    </linearGradient>

    <!-- Notification Badge Gradient -->
    <linearGradient id="badge-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ff7e54" />
      <stop offset="65%" stop-color="#f05347" />
      <stop offset="100%" stop-color="#d53a3a" />
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="eye-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#073a61" flood-opacity="0.22" />
    </filter>

    <filter id="env-shadow" x="-10%" y="-5%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#021f5c" flood-opacity="0.32" />
    </filter>

    <filter id="badge-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#031b4b" flood-opacity="0.35" />
    </filter>

    <!-- Envelope Clipping Path for Rounded Corners -->
    <clipPath id="env-clip">
      <rect x="210" y="512" width="604" height="362" rx="16" ry="16" />
    </clipPath>
  </defs>

  <!-- ==================== 1. APP ICON SQUIRCLE ==================== -->
  <rect x="84" y="84" width="856" height="856" rx="192" ry="192" fill="url(#icon-bg-grad)" />

  <!-- ==================== 2. GOPHER MASCOT ==================== -->
  <!-- Left Ear -->
  <g transform="translate(334, 258) rotate(-30)">
    <ellipse cx="0" cy="0" rx="27" ry="36" fill="#6ecced" />
    <ellipse cx="0" cy="0" rx="16" ry="22" fill="#4590b1" />
  </g>

  <!-- Right Ear -->
  <g transform="translate(690, 258) rotate(30)">
    <ellipse cx="0" cy="0" rx="27" ry="36" fill="#4faed7" />
    <ellipse cx="0" cy="0" rx="16" ry="22" fill="#367f9f" />
  </g>

  <!-- Head / Body (Split Tone) -->
  <!-- Left Side (Light Cyan) -->
  <path d="M 512,202 C 418,202 360,214 322,246 C 298,266 296,298 296,340 L 296,520 L 512,520 Z" fill="#6ecced" />
  <!-- Right Side (Darker Cyan) -->
  <path d="M 512,202 C 606,202 664,214 702,246 C 726,266 728,298 728,340 L 728,520 L 512,520 Z" fill="#4faed7" />

  <!-- Left Eye -->
  <g filter="url(#eye-shadow)">
    <circle cx="406" cy="366" r="76" fill="#ffffff" />
  </g>
  <circle cx="408" cy="366" r="21" fill="#1e2631" />
  <circle cx="415" cy="358" r="6.5" fill="#ffffff" />

  <!-- Right Eye -->
  <g filter="url(#eye-shadow)">
    <circle cx="618" cy="366" r="76" fill="#ffffff" />
  </g>
  <circle cx="616" cy="366" r="21" fill="#1e2631" />
  <circle cx="623" cy="358" r="6.5" fill="#ffffff" />

  <!-- Buck Teeth -->
  <path d="M 493,458 L 512,458 L 512,480 L 497,480 C 494.5,480 493,478 493,475.5 Z" fill="#ffffff" />
  <path d="M 512,458 L 531,458 L 531,475.5 C 531,478 529.5,480 527,480 L 512,480 Z" fill="#e8edf2" />

  <!-- Muzzle / Snout -->
  <path d="M 512,416 C 478,416 458,426 458,442 C 458,458 478,467 512,467 Z" fill="#528ea9" />
  <path d="M 512,416 C 546,416 566,426 566,442 C 566,458 546,467 512,467 Z" fill="#407a94" />

  <!-- Nose -->
  <ellipse cx="512" cy="414" rx="25" ry="17" fill="#1e2631" />

  <!-- ==================== 3. MAIL ENVELOPE ==================== -->
  <g filter="url(#env-shadow)">
    <g clip-path="url(#env-clip)">
      <!-- Envelope Background Facets -->
      <rect x="210" y="512" width="302" height="362" fill="#ffffff" />
      <rect x="512" y="512" width="302" height="362" fill="#edf2f7" />

      <!-- Downward Flap Shading -->
      <polygon points="210,512 512,512 512,746" fill="#ffffff" />
      <polygon points="512,512 814,512 512,746" fill="#edf2f7" />

      <!-- Envelope Interior Creases -->
      <polyline points="210,512 512,746 814,512" fill="none" stroke="#7e99ba" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
      <polyline points="210,874 512,746 814,874" fill="none" stroke="#7e99ba" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Envelope Outer Border (Left, Bottom, Right) -->
    <path d="M 210,512 L 210,858 C 210,867 217,874 226,874 L 798,874 C 807,874 814,867 814,858 L 814,512" fill="none" stroke="#7e99ba" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ==================== 4. NOTIFICATION BADGE ==================== -->
  <circle cx="804" cy="498" r="54" fill="url(#badge-grad)" filter="url(#badge-shadow)" />
</svg>
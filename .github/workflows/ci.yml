name: Continuous Integration

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  secret-scan:
    name: Secret & Credential Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies & Audit
        run: dotnet restore GotifyWin.sln

      - name: Verify No Vulnerable Packages
        run: dotnet list package --vulnerable --include-transitive

      - name: Build Solution (with WpfAnalyzers & SecurityCodeScan)
        run: dotnet build GotifyWin.sln --configuration Release --no-restore

      - name: Run Automated Tests
        run: dotnet test GotifyWin.sln --configuration Release --no-build --verbosity normal
